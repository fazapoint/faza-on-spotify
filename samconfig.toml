version = 0.1

[default.global.parameters]
stack_name = "spotify-lambda"
region = "ap-southeast-3"

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
resolve_image_repos = true
# Uncomment and set your AWS region if you don't want to rely on the CLI default.
# region = "ap-southeast-1"
s3_prefix = "spotify-lambda"
region = "ap-southeast-3"
parameter_overrides = "ScheduleExpression=\"cron(0 5,11,17 * * ? *)\" LogLevel=\"INFO\""
