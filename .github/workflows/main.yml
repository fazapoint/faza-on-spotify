name: Fetch Spotify Recently Played

on:
  schedule:
    - cron: '0 5,11,17 * * *'
  workflow_dispatch: 

jobs:
  run-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          # This tells GitHub to look for requirements.txt inside your subdirectory for caching
          cache-dependency-path: 'requirements.txt' 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Point pip to your specific requirements.txt path
          pip install -r requirements.txt

      - name: Inject Spotify Token Cache
        run: |
          # Keep this at the root or create it where your script expects it
          echo '${{ secrets.SPOTIPY_CACHE_DATA }}' > .cache

      - name: Run Extraction Script
        env:
          SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
          SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
          SPOTIPY_REDIRECT_URI: ${{ secrets.SPOTIPY_REDIRECT_URI }}
          ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
          ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY_ID }}
          SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS_KEY }}
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
        run: |
          # Point Python directly to the subfolder path of your script
          python cloud/extract/extract_recently_played.py